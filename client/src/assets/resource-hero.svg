  <rect x="44" y="238" width="46" height="11" rx="5.5" fill="#f1f5f9" />
  <rect x="49" y="249" width="36" height="19" rx="8" fill="#e2e8f0" />
  <rect x="65" y="212" width="4" height="30" rx="2" fill="#059669" />
