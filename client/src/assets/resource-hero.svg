  <!-- dotted accents -->
  <circle cx="352" cy="86" r="4" fill="#93c5fd" />
  <circle cx="368" cy="118" r="3" fill="#bfdbfe" />
  <circle cx="72" cy="86" r="3.5" fill="#a5b4fc" />

