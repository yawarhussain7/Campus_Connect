<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rh-blob" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#eaf2ff" />
      <stop offset="1" stop-color="#d3e4ff" />
    </linearGradient>
    <linearGradient id="rh-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7" />
      <stop offset="1" stop-color="#10b981" />
