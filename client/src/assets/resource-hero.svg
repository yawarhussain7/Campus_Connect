  <!-- soft background blob -->
  <path d="M84 158c0-66 46-118 122-124 64-5 122 24 148 70 24 42 8 100-40 128-44 26-118 32-166 8C104 218 84 196 84 158Z" fill="url(#rh-blob)" />

